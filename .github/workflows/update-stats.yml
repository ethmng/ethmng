name: Update README cards

on:
  schedule:
    - cron: "0 4 * * *"   # Tous les jours à 4h du matin
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ethmng&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=6E85F7&icon_color=6E85F7&text_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ethmng&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=6E85F7&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats cards" || exit 0
          git push
